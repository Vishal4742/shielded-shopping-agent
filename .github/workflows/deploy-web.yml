name: deploy-web

# Landing page (web/) on Cloudflare Workers static assets.
# main -> production; pull requests -> a preview version whose URL is posted on the PR.
on:
  push:
    branches: [main]
    paths: ["web/**", "wrangler.jsonc", ".github/workflows/deploy-web.yml"]
  pull_request:
    paths: ["web/**", "wrangler.jsonc"]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check static site (every file referenced by index.html exists)
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' web/index.html | cut -d'"' -f2 | sort -u); do
            [ -e "web/$f" ] || { echo "missing: web/$f"; missing=1; }
          done
          exit $missing

      - name: Deploy production
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          command: deploy

      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const urls = (process.env.OUT || '').match(/https:\/\/\S+workers\.dev\S*/g) || [];
            const body = urls.length ? `Preview: ${urls.join(' · ')}` : 'Preview uploaded (see the deploy-web log for the URL).';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
