[package]
name = "ssa"
version = "0.1.0"
edition = "2024"
description = "Shielded Shopping Agent: Telegram bot buying Indian mobile top-ups from a shielded Zcash budget"
license = "MIT"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
rusqlite = { version = "0.41", features = ["bundled"] }
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
